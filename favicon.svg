<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6"/>
  
  <!-- Alchemy / Chemistry Flask Logo Icon -->
  <g transform="translate(14, 14)" stroke="url(#emeraldGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Flask Neck and Lip -->
    <path d="M11 2h14l-1 2v9.3a4 4 0 001.2 2.8l10 10c2.5 2.5.7 6.9-2.8 6.9H3.6c-3.5 0-5.3-4.4-2.8-6.9l10-10A4 4 0 0012 13.3V4L11 2z"/>
    <!-- Liquid Level Inside Flask -->
    <path d="M30 27a4 4 0 00-2-1.1l-4.8-1a12 12 0 00-7.7 1l-.6.3a12 12 0 01-7.7 1L3 26.5a4 4 0 00-3.6 1.1" stroke="#34d399" stroke-width="2.2" stroke-opacity="0.85"/>
  </g>
  
  <!-- Matrix Energy Sparkles -->
  <circle cx="28" cy="40" r="1.8" fill="#6ee7b7"/>
  <circle cx="36" cy="44" r="1.3" fill="#34d399"/>
  <circle cx="32" cy="47" r="1.5" fill="#10b981"/>
</svg>
